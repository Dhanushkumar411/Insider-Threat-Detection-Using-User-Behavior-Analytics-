<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Insider Threat Detection{% endblock %}</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --bg-card: #1e293b;
      --bg-hover: #263348;
      --border: #334155;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --accent-cyan: #06b6d4;
      --accent-emerald: #10b981;
      --accent-red: #ef4444;
      --accent-amber: #f59e0b;
      --accent-blue: #3b82f6;
      --sidebar-width: 220px;
    }

    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      min-height: 100vh;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: var(--sidebar-width);
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; left: 0; bottom: 0;
      z-index: 100;
      overflow-y: auto;
    }
    .sidebar-brand {
      padding: 20px 16px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-brand h2 {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent-cyan);
    }
    .sidebar-brand p {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 2px;
    }
    .nav-section { padding: 16px 8px 8px; }
    .nav-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-secondary);
      padding: 0 8px;
      margin-bottom: 6px;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 8px;
      text-decoration: none;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 500;
      transition: all 0.15s;
      margin-bottom: 2px;
    }
    .nav-item:hover { background: var(--bg-hover); color: var(--text-primary); }
    .nav-item.active { background: rgba(6,182,212,0.15); color: var(--accent-cyan); }
    .nav-icon { font-size: 16px; width: 20px; text-align: center; }

    /* ── Top Bar ── */
    .topbar {
      position: fixed;
      top: 0;
      left: var(--sidebar-width);
      right: 0;
      height: 56px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 99;
    }
    .topbar-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 13px;
      color: var(--text-secondary);
    }
    .live-clock { font-family: monospace; font-size: 13px; color: var(--accent-cyan); }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent-emerald);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ── Main Content ── */
    .main-content {
      margin-left: var(--sidebar-width);
      margin-top: 56px;
      flex: 1;
      padding: 28px 28px;
      min-height: calc(100vh - 56px);
    }

    /* ── Cards ── */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .card-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .card-subtitle {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    /* ── Stat Cards ── */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }
    .stat-label { font-size: 12px; color: var(--text-secondary); font-weight: 500; }
    .stat-value { font-size: 32px; font-weight: 700; margin: 6px 0 4px; color: var(--text-primary); }
    .stat-sub { font-size: 12px; color: var(--text-secondary); }
    .stat-icon { font-size: 22px; margin-bottom: 6px; }

    /* ── Charts Grid ── */
    .charts-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 16px;
      margin-bottom: 24px;
    }
    .chart-container { position: relative; }

    /* ── Tables ── */
    .table-wrapper { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th {
      text-align: left;
      padding: 10px 14px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--text-secondary);
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 11px 14px;
      border-bottom: 1px solid rgba(51,65,85,0.5);
      color: var(--text-primary);
      vertical-align: middle;
    }
    tr:hover td { background: rgba(255,255,255,0.02); }
    tr:last-child td { border-bottom: none; }

    /* ── Badges ── */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }
    .badge-high { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.3); }
    .badge-medium { background: rgba(245,158,11,0.15); color: #fbbf24; border: 1px solid rgba(245,158,11,0.3); }
    .badge-normal { background: rgba(16,185,129,0.15); color: #34d399; border: 1px solid rgba(16,185,129,0.3); }
    .badge-blue { background: rgba(59,130,246,0.15); color: #60a5fa; border: 1px solid rgba(59,130,246,0.3); }
    .badge-high.pulse { animation: alert-pulse 1.5s infinite; }
    @keyframes alert-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.4); }
      50% { box-shadow: 0 0 0 6px rgba(239,68,68,0); }
    }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      text-decoration: none;
      transition: all 0.15s;
    }
    .btn-primary { background: var(--accent-cyan); color: #0f172a; }
    .btn-primary:hover { background: #22d3ee; }
    .btn-danger { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.3); }
    .btn-danger:hover { background: rgba(239,68,68,0.25); }
    .btn-ghost { background: transparent; color: var(--text-secondary); border: 1px solid var(--border); }
    .btn-ghost:hover { background: var(--bg-hover); color: var(--text-primary); }
    .btn-sm { padding: 5px 11px; font-size: 12px; }

    /* ── Page Header ── */
    .page-header { margin-bottom: 24px; }
    .page-header h1 { font-size: 22px; font-weight: 700; }
    .page-header p { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 28px;
      right: 28px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 20px;
      font-size: 14px;
      z-index: 9999;
      display: none;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      max-width: 340px;
    }
    #toast.show { display: block; }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-primary); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }

    /* ── Tabs ── */
    .tabs { display: flex; gap: 4px; margin-bottom: 20px; }
    .tab-btn {
      padding: 7px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-secondary);
      transition: all 0.15s;
      text-decoration: none;
    }
    .tab-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
    .tab-btn.active { background: var(--accent-cyan); color: #0f172a; border-color: var(--accent-cyan); }

    /* ── Score Gauge ── */
    .gauge-wrap { text-align: center; padding: 20px 0; }
    .gauge-value {
      font-size: 48px;
      font-weight: 800;
      font-family: monospace;
    }
    .gauge-label { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }

    /* ── Forms ── */
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--text-secondary); }
    input, select, textarea {
      width: 100%;
      padding: 9px 12px;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent-cyan); }
    select option { background: var(--bg-secondary); }

    /* ── Result Card ── */
    .result-card {
      display: none;
      margin-top: 20px;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg-primary);
    }
    .result-card.visible { display: block; }

    /* ── Utilities ── */
    .text-danger { color: #f87171; }
    .text-warning { color: #fbbf24; }
    .text-success { color: #34d399; }
    .text-muted { color: var(--text-secondary); }
    .text-sm { font-size: 12px; }
    .mt-1 { margin-top: 4px; }
    .mt-2 { margin-top: 8px; }
    .mt-3 { margin-top: 16px; }
    .flex { display: flex; }
    .items-center { align-items: center; }
    .gap-2 { gap: 8px; }
    .gap-3 { gap: 12px; }
    .justify-between { justify-content: space-between; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    @media (max-width: 900px) {
      .stat-grid { grid-template-columns: repeat(2, 1fr); }
      .charts-grid { grid-template-columns: 1fr; }
      .grid-2 { grid-template-columns: 1fr; }
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar">
  <div class="sidebar-brand">
    <h2>🛡️ ThreatWatch</h2>
    <p>Insider Threat Detection</p>
  </div>
  <nav class="nav-section">
    <p class="nav-label">Analytics</p>
    <a href="{{ url_for('dashboard') }}" class="nav-item {% if request.endpoint == 'dashboard' %}active{% endif %}">
      <span class="nav-icon">📊</span> Dashboard
    </a>
    <a href="{{ url_for('users_list') }}" class="nav-item {% if 'user' in request.endpoint %}active{% endif %}">
      <span class="nav-icon">👥</span> Users
    </a>
    <a href="{{ url_for('alerts') }}" class="nav-item {% if request.endpoint == 'alerts' %}active{% endif %}">
      <span class="nav-icon">🚨</span> Alerts
    </a>
  </nav>
  <nav class="nav-section">
    <p class="nav-label">Tools</p>
    <a href="{{ url_for('simulate') }}" class="nav-item {% if 'simulate' in request.endpoint %}active{% endif %}">
      <span class="nav-icon">🧪</span> Simulate
    </a>
  </nav>
</aside>

<!-- Top Bar -->
<header class="topbar">
  <span class="topbar-title">{% block page_title %}Insider Threat Detection{% endblock %}</span>
  <div class="topbar-right">
    <div class="status-dot"></div>
    <span>System Active</span>
    <span class="live-clock" id="clock">--:--:--</span>
  </div>
</header>

<!-- Main -->
<main class="main-content">
  {% block content %}{% endblock %}
</main>

<!-- Toast -->
<div id="toast"></div>

<script>
  // Live clock
  function updateClock() {
    const now = new Date();
    document.getElementById('clock').textContent =
      now.toLocaleTimeString('en-GB', { hour12: false });
  }
  updateClock();
  setInterval(updateClock, 1000);

  // Toast helper
  function showToast(msg, color='#06b6d4') {
    const t = document.getElementById('toast');
    t.innerHTML = msg;
    t.style.borderColor = color;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 4000);
  }
</script>
{% block scripts %}{% endblock %}
</body>
</html>
